name: Build Windows WPF preview
run-name: ${{ inputs.version_label || 'Build Windows WPF preview' }}

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: Identificação desta versão no histórico do workflow
        required: false
        default: Build Windows WPF preview
  push:
    branches:
      - main
    paths:
      - 'desktop_wpf/**'
      - 'app/models/api_refresh_token.py'
      - 'app/models/api_sale_request.py'
      - 'app/routes/api/**'
      - 'app/services/api_auth_service.py'
      - 'app/services/dashboard_service.py'
      - 'app/services/cash_register_service.py'
      - 'app/services/category_service.py'
      - 'app/services/product_service.py'
      - 'app/services/sale_service.py'
      - 'app/security/csrf.py'
      - 'config.py'
      - 'tests/test_routes.py'
      - '.github/workflows/build-windows-wpf.yml'
  pull_request:
    paths:
      - 'desktop_wpf/**'
      - 'app/models/api_refresh_token.py'
      - 'app/models/api_sale_request.py'
      - 'app/routes/api/**'
      - 'app/services/api_auth_service.py'
      - 'app/services/dashboard_service.py'
      - 'app/services/cash_register_service.py'
      - 'app/services/category_service.py'
      - 'app/services/product_service.py'
      - 'app/services/sale_service.py'
      - 'app/security/csrf.py'
      - 'config.py'
      - 'tests/test_routes.py'
      - '.github/workflows/build-windows-wpf.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inline WPF bindings
        shell: pwsh
        run: |
          $violations = Get-ChildItem desktop_wpf/src/Girofy.Desktop -Recurse -Filter *.xaml |
            Select-String -Pattern '<Run[^>]*Text="\{Binding(?![^}]*Mode=OneWay)'
          if ($violations) {
            $violations | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Run.Text bindings must explicitly use Mode=OneWay.'
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend contract tests
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest tests.test_routes

      - name: Restore solution
        run: dotnet restore desktop_wpf/Girofy.Desktop.sln

      - name: Run unit tests
        run: dotnet test desktop_wpf/Girofy.Desktop.sln --configuration Release --no-restore

      - name: Publish self-contained Windows preview
        run: >-
          dotnet publish desktop_wpf/src/Girofy.Desktop/Girofy.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          --output desktop_wpf/artifacts/Girofy-Windows-WPF

      - name: Package preview
        shell: pwsh
        run: Compress-Archive -Path desktop_wpf/artifacts/Girofy-Windows-WPF/* -DestinationPath desktop_wpf/artifacts/Girofy-Windows-WPF-preview.zip -Force

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Girofy-Windows-WPF-preview
          path: desktop_wpf/artifacts/Girofy-Windows-WPF-preview.zip
          if-no-files-found: error
          retention-days: 7
