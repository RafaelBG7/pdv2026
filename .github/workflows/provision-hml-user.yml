name: Provisionar usuário HML

on:
  workflow_dispatch:
    inputs:
      username:
        description: Login a criar no HML
        required: true
        type: string
        default: adegajf
      company_name:
        description: Nome da adega HML
        required: true
        type: string
        default: Adega JF

permissions:
  contents: read

concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  provision:
    name: Criar conta no HML
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    environment: homologation
    env:
      HML_DEPLOY_PATH: /opt/girofy/hml
      HML_COPY_USERNAME: ${{ inputs.username }}
      HML_COPY_COMPANY_NAME: ${{ inputs.company_name }}
      HML_COPY_USER_PASSWORD: ${{ secrets.HML_COPY_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar solicitação
        shell: bash
        run: |
          test -n "$HML_COPY_USERNAME"
          test -n "$HML_COPY_COMPANY_NAME"
          test -n "$HML_COPY_USER_PASSWORD"
          test "${#HML_COPY_USER_PASSWORD}" -ge 8
          test -f "$HML_DEPLOY_PATH/.env.hml"

      - name: Criar conta somente na stack HML
        shell: bash
        working-directory: ${{ env.HML_DEPLOY_PATH }}
        run: |
          docker compose --env-file .env.hml -p skygest-hml -f docker-compose.hml.yml exec -T \
            -e HML_COPY_USERNAME \
            -e HML_COPY_COMPANY_NAME \
            -e HML_COPY_USER_PASSWORD \
            app python /app/scripts/provision_hml_user.py

      - name: Validar login público HML
        shell: bash
        run: curl -fsS https://hml.skygest.com.br/login >/dev/null
