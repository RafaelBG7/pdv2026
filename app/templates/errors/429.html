{% extends 'base.html' %}
{% block content %}
<div class="card card-dark mx-auto" style="max-width: 680px;">
  <div class="card-body p-4">
    <h2>Muitas tentativas</h2>
    <p class="text-muted mb-2">Muitas requisições foram realizadas. Aguarde alguns instantes e tente novamente.</p>
    {% if retry_after %}<p class="mb-0">Nova tentativa em aproximadamente {{ retry_after }} segundo(s).</p>{% endif %}
  </div>
</div>
{% endblock %}
