server {
    listen 80;
    listen [::]:80;
    server_name hml.skygest.com.br;

    location = / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-SkyGest-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-SkyGest-Forwarded-Proto $scheme;
    }

    location / {
        return 302 https://app.hml.skygest.com.br$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.hml.skygest.com.br;

    location = / {
        return 302 /login;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Marcador sobrescrito no proxy público e preservado pelo Caddy interno.
        proxy_set_header X-SkyGest-Forwarded-Proto $scheme;
    }
}
