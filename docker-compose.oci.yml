services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adega_central}
      MYSQL_USER: ${MYSQL_USER:-girofy_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - girofy_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
    read_only: true
    tmpfs:
      - /data:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      FLASK_DEBUG: "0"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_SERVER_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/mysql?charset=utf8mb4
      RATELIMIT_ENABLED: "1"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      RATELIMIT_IN_MEMORY_FALLBACK_ENABLED: "0"
      TRUST_PROXY_HEADERS: "1"
      TRUSTED_PROXY_COUNT: "1"
      SCHEMA_MANAGEMENT_MODE: verify
      PORT: "5003"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${GIROFY_BACKUP_HOST_DIR:-/opt/girofy/backups}:/app/backups
      - girofy_logs:/app/logs
      - girofy_reports:/app/reports
    ports:
      - "127.0.0.1:5003:5003"

  backup:
    build: .
    restart: unless-stopped
    user: "${GIROFY_BACKUP_UID:-1001}:${GIROFY_BACKUP_GID:-1001}"
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_BACKUP_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      AUTO_BACKUP_DIR: /backups
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-1}
      AUTO_BACKUP_INTERVAL_SECONDS: ${AUTO_BACKUP_INTERVAL_SECONDS:-86400}
      AUTO_BACKUP_RETENTION_DAYS: ${AUTO_BACKUP_RETENTION_DAYS:-30}
      AUTO_BACKUP_RETENTION_COUNT: ${AUTO_BACKUP_RETENTION_COUNT:-30}
      AUTO_AUDIT_CLEANUP_ENABLED: ${AUTO_AUDIT_CLEANUP_ENABLED:-1}
      AUTO_AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUTO_AUDIT_CLEANUP_INTERVAL_SECONDS:-259200}
      AUTO_AUDIT_RETENTION_DAYS: ${AUTO_AUDIT_RETENTION_DAYS:-90}
    command: ["sh", "/app/scripts/backup_mysql.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ${GIROFY_BACKUP_HOST_DIR:-/opt/girofy/backups}:/backups
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      GIROFY_SITE_ADDRESS: ${GIROFY_SITE_ADDRESS:-:18080}
    ports:
      - "${GIROFY_PUBLIC_HTTP_PORT:-18080}:18080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  girofy_mysql_data:
  girofy_logs:
  girofy_reports:
  caddy_data:
  caddy_config:
