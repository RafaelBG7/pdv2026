server {
    listen 80;
    listen [::]:80;
    server_name skygest.com.br www.skygest.com.br app.skygest.com.br;

    return 301 https://skygest.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skygest.com.br;

    ssl_certificate /etc/letsencrypt/live/skygest.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skygest.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5003;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-SkyGest-Forwarded-Proto https;
    }
}

# Compatibilidade sem interrupção: hosts antigos preservam método e caminho.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.skygest.com.br app.skygest.com.br;

    ssl_certificate /etc/letsencrypt/live/skygest.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skygest.com.br/privkey.pem;

    return 308 https://skygest.com.br$request_uri;
}
