<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://168.75.101.126:18080 https://app.girofy.com.br;" />
    <title>Girofy</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <section class="boot-card">
        <div class="brand-row">
          <img src="./src/logo.png" alt="Girofy" class="brand-logo" />
          <div>
            <h1>Girofy</h1>
            <p>Conectando ao sistema...</p>
          </div>
        </div>

        <div class="status-panel" id="statusPanel">
          <div class="spinner" aria-hidden="true"></div>
          <div>
            <strong id="statusTitle">Preparando ambiente</strong>
            <span id="statusMessage">Verificando a conexão com o servidor Girofy.</span>
          </div>
        </div>

        <div class="actions" id="actions" hidden>
          <button id="retryButton" type="button">Tentar novamente</button>
          <button id="openBrowserButton" type="button" class="secondary">Abrir no navegador</button>
        </div>

        <p class="hint" id="hint">Este cliente não armazena vendas, senhas ou banco de dados localmente.</p>
      </section>
    </main>
    <script src="./src/main.js"></script>
  </body>
</html>
