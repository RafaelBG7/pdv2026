name: Deploy HML OCI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

# Produção e HML compartilham uma VM pequena; nunca buildar as duas stacks ao mesmo tempo.
concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes e isolamento HML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testes automatizados
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest discover

      - name: Validar migrations e guardrails
        env:
          TESTING: '1'
        run: |
          python scripts/schema_migrate.py --help
          python scripts/validate_environment_isolation.py --environment homologation --env-file .env.hml.example --allow-example-secrets
          python -c "from app.services.migration_service import migration_head; assert migration_head('central') == 'central_0007'; assert migration_head('tenant') == 'tenant_0008'"

      - name: Validar Docker Compose HML
        run: docker compose --env-file .env.hml.example -p skygest-hml -f docker-compose.hml.yml config --quiet

      - name: Validar scripts
        run: |
          bash -n scripts/deploy_hml.sh
          bash -n scripts/provision_hml_env.sh
          bash -n scripts/configure_hml_gateway.sh
          bash -n scripts/audit_oci_readonly.sh

  windows-test:
    name: Validar cliente Windows HML/PROD
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar, testar e compilar
        run: |
          dotnet restore desktop_wpf/Girofy.Desktop.sln
          dotnet test desktop_wpf/tests/Girofy.UnitTests/Girofy.UnitTests.csproj --configuration Release --no-restore
          dotnet build desktop_wpf/src/Girofy.Desktop/Girofy.Desktop.csproj --configuration Release --no-restore

  deploy:
    name: Publicar homologação na OCI
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    needs:
      - test
      - windows-test
    environment: homologation
    env:
      HML_DEPLOY_PATH: /opt/girofy/hml
      PRODUCTION_DEPLOY_PATH: /opt/girofy/app
      HML_LOOPBACK_PORT: '18081'
      HML_DOMAIN: hml.skygest.com.br
      EXPECTED_PUBLIC_IP: ${{ vars.EXPECTED_PUBLIC_IP || '168.75.101.126' }}
      HML_MASTER_DEFAULT_PASSWORD: ${{ secrets.HML_MASTER_DEFAULT_PASSWORD }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar stack HML isolada
        run: bash scripts/deploy_hml.sh

      - name: Configurar e validar gateway HTTPS HML
        run: bash scripts/configure_hml_gateway.sh

      - name: Health checks públicos HML e PROD
        run: |
          curl -fsS https://hml.skygest.com.br/login >/dev/null
          curl -fsS https://hml.skygest.com.br/health/dependencies >/dev/null
          curl -fsS https://hml.skygest.com.br/api/v1/health/dependencies >/dev/null
          curl -fsS https://skygest.com.br/health/dependencies >/dev/null
