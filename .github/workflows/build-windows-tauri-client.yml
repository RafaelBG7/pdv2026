name: Build Windows Tauri client

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-tauri-v*"
    paths:
      - "desktop_tauri/**"
      - "scripts/build_windows_tauri.ps1"
      - ".github/workflows/build-windows-tauri-client.yml"
      - "app/routes/main.py"
      - "tests/test_routes.py"

jobs:
  run-tests:
    name: Run backend and client tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        shell: pwsh
        run: python -m unittest discover

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: desktop_tauri
        shell: pwsh
        run: npm install

      - name: Run frontend checks
        working-directory: desktop_tauri
        shell: pwsh
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run Rust checks
        working-directory: desktop_tauri/src-tauri
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

  build-windows-tauri:
    name: Build Windows Tauri client
    needs: run-tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2 bootstrap dependency
        shell: pwsh
        run: |
          Write-Host "O instalador Tauri baixa/garante o WebView2 quando necessario."

      - name: Build Tauri client
        shell: pwsh
        run: .\scripts\build_windows_tauri.ps1

      - name: Upload Tauri installers
        uses: actions/upload-artifact@v4
        with:
          name: Girofy-Windows-Tauri-Installers
          path: |
            dist/tauri/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/windows-tauri-v')
    needs: build-windows-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Girofy-Windows-Tauri-Installers
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
