{% extends 'base.html' %}
{% block content %}
<div class="card card-dark mx-auto" style="max-width: 680px;">
  <div class="card-body p-4">
    <h2>Muitas tentativas</h2>
    <p class="text-muted mb-2">{{ message }}</p>
    {% if retry_after_label %}<p class="mb-3">Tente novamente em aproximadamente {{ retry_after_label }}.</p>{% endif %}
    <a class="btn btn-outline-light" href="{{ url_for('auth.login') }}">Voltar ao acesso</a>
  </div>
</div>
{% endblock %}
