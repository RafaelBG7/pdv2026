name: Deploy OCI Self Hosted

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação segura a executar
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - audit
          - hml
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testes automatizados
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest discover

      - name: Validar árvores de migrations
        env:
          TESTING: '1'
        run: |
          python scripts/schema_migrate.py --help
          python -c "from app.services.migration_service import migration_head; assert migration_head('central') == 'central_0010'; assert migration_head('tenant') == 'tenant_0010'"

      - name: Sintaxe dos scripts de deploy
        run: |
          bash -n scripts/deploy_self_hosted_app.sh
          bash -n scripts/deploy_oci_app.sh
          python -m py_compile scripts/cleanup_system_tenant.py
          bash -n scripts/oci/load_oci_env.sh
          bash -n scripts/oci/oci_check.sh
          bash -n scripts/oci/oci_harden_network.sh

      - name: Validar stack HML no bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'hml'
        run: |
          python scripts/validate_environment_isolation.py --environment homologation --env-file .env.hml.example --allow-example-secrets
          cp .env.hml.example .env.hml
          docker compose --env-file .env.hml -p skygest-hml -f docker-compose.hml.yml config --quiet
          bash -n scripts/deploy_hml.sh
          bash -n scripts/provision_hml_env.sh
          bash -n scripts/configure_hml_gateway.sh
          python -m py_compile scripts/cleanup_system_tenant.py

  deploy:
    name: Publicar na OCI
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    needs: test
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    environment: production

    env:
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/girofy/app' }}
      OCI_DEPLOY_PORT: ${{ vars.OCI_DEPLOY_PORT || '18080' }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar containers na própria VM
        run: bash scripts/deploy_self_hosted_app.sh

      - name: Health check local
        run: |
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/login" >/dev/null
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/health/dependencies" >/dev/null
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/api/v1/health/dependencies" >/dev/null
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/health/version" >/dev/null

  audit:
    name: Auditoria OCI somente leitura
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    environment: production
    env:
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/girofy/app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditar sem alterar infraestrutura
        run: bash scripts/audit_oci_readonly.sh

  hml-windows-test:
    name: Validar cliente Windows HML/PROD
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'hml'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar, testar e compilar
        run: |
          dotnet restore desktop_wpf/Girofy.Desktop.sln
          dotnet test desktop_wpf/tests/Girofy.UnitTests/Girofy.UnitTests.csproj --configuration Release --no-restore
          dotnet build desktop_wpf/src/Girofy.Desktop/Girofy.Desktop.csproj --configuration Release --no-restore

  hml-deploy:
    name: Bootstrap da homologação na OCI
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'hml'
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    needs:
      - test
      - hml-windows-test
    environment: homologation
    env:
      HML_DEPLOY_PATH: /opt/girofy/hml
      PRODUCTION_DEPLOY_PATH: /opt/girofy/app
      HML_LOOPBACK_PORT: '18081'
      HML_DOMAIN: hml.skygest.com.br
      EXPECTED_PUBLIC_IP: ${{ vars.EXPECTED_PUBLIC_IP || '168.75.101.126' }}
      HML_MASTER_DEFAULT_PASSWORD: ${{ secrets.HML_MASTER_DEFAULT_PASSWORD }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar stack HML isolada
        run: bash scripts/deploy_hml.sh

      - name: Configurar e validar gateway HTTPS HML
        run: bash scripts/configure_hml_gateway.sh
