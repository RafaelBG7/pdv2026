{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
  <div class="col-md-5">
    <div class="card card-dark p-4 shadow">
      <h2 class="mb-2 text-center">Confirmar e-mail</h2>
      <p class="text-center text-muted">Digite o código enviado para {{ user.masked_email }}.</p>

      <form method="post">
        <label class="form-label" for="code">Código de 6 dígitos</label>
        <input class="form-control text-center fs-4" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
        <button class="btn btn-primary w-100 mt-3" type="submit">Confirmar</button>
      </form>

      <form method="post" action="{{ url_for('auth.resend_verification_code') }}" class="mt-3">
        <button class="btn btn-outline-light w-100" type="submit">Reenviar código</button>
      </form>

      <div class="text-center mt-3">
        <a class="text-muted" href="{{ url_for('auth.login') }}">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
