name: Deploy OCI Self Hosted

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testes automatizados
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest discover

      - name: Validar árvores de migrations
        env:
          TESTING: '1'
        run: |
          python scripts/schema_migrate.py --help
          python -c "from app.services.migration_service import migration_head; assert migration_head('central') == 'central_0002'; assert migration_head('tenant') == 'tenant_0004'"

      - name: Sintaxe dos scripts de deploy
        run: |
          bash -n scripts/deploy_self_hosted_app.sh
          bash -n scripts/deploy_oci_app.sh
          bash -n scripts/oci/load_oci_env.sh
          bash -n scripts/oci/oci_check.sh
          bash -n scripts/oci/oci_harden_network.sh

  deploy:
    name: Publicar na OCI
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    needs: test
    environment: production

    env:
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/girofy/app' }}
      OCI_DEPLOY_PORT: ${{ vars.OCI_DEPLOY_PORT || '18080' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnosticar falhas recentes de contas a pagar
        shell: bash
        run: |
          cd "$OCI_DEPLOY_PATH"
          payable_diagnostic="$({
            docker compose -f docker-compose.oci.yml logs --since=24h app 2>&1 |
              grep -A 24 -B 2 'Falha inesperada ao carregar contas a pagar' |
              grep -E 'sqlalchemy\.exc\.|pymysql\.|psycopg|OperationalError:|ProgrammingError:|DataError:|TypeError:|ValueError:' |
              tail -6 || true
          } | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          {
            echo '### Diagnóstico de contas a pagar antes do deploy'
            echo '```text'
            docker compose -f docker-compose.oci.yml logs --since=24h app 2>&1 |
              grep -A 24 -B 2 'Falha inesperada ao carregar contas a pagar' |
              grep -E 'Falha inesperada|Traceback|File ".*", line|Error:|Exception:' |
              tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$payable_diagnostic" ]; then
            echo "::error title=Diagnóstico temporário da API de contas a pagar::$payable_diagnostic"
          fi
          docker compose -f docker-compose.oci.yml exec -T app python - <<'PY'
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import sessionmaker

          from app import create_app
          from app.routes.api.v1 import payable_snapshot
          from scripts.schema_migrate import central_engine, tenant_names, tenant_url

          application = create_app()
          central = central_engine()
          try:
              names = tenant_names(central)
          finally:
              central.dispose()
          with application.app_context():
              for name in names:
                  engine = create_engine(tenant_url(name))
                  try:
                      with engine.connect() as connection:
                          company_ids = [row[0] for row in connection.execute(text('SELECT id FROM companies'))]
                      session = sessionmaker(bind=engine)()
                      try:
                          for company_id in company_ids:
                              payable_snapshot(session, company_id, 'open', '', 'all', None, None)
                      finally:
                          session.close()
                  except Exception as error:
                      message = f'{type(error).__name__}: {error}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title=Diagnóstico direto da API de contas a pagar::{message}')
                  finally:
                      engine.dispose()
          PY

      - name: Publicar containers na própria VM
        run: bash scripts/deploy_self_hosted_app.sh

      - name: Health check local
        run: |
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/login" >/dev/null
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/health/dependencies" >/dev/null
          curl -fsS "http://127.0.0.1:${OCI_DEPLOY_PORT}/api/v1/health/dependencies" >/dev/null
