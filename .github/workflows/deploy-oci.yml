name: Deploy OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testes automatizados
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest discover

      - name: Sintaxe dos scripts de infra
        run: |
          bash -n scripts/oci/load_oci_env.sh
          bash -n scripts/oci/oci_check.sh
          bash -n scripts/oci/oci_create_free_tier_vm.sh
          bash -n scripts/oci/oci_harden_network.sh
          bash -n scripts/deploy_oci_app.sh

  deploy:
    name: Publicar na OCI
    runs-on: ubuntu-latest
    needs: test
    environment: production

    env:
      OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
      OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
      OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
      OCI_DEPLOY_PORT: ${{ vars.OCI_DEPLOY_PORT || '18080' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configurar SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          test -n "$OCI_DEPLOY_HOST"
          test -n "$OCI_DEPLOY_USER"
          test -n "$OCI_DEPLOY_PATH"
          test -n "$OCI_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          ssh-keyscan -H "$OCI_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sincronizar e reiniciar containers
        env:
          SSH_OPTS: -i ~/.ssh/oci_deploy_key -o StrictHostKeyChecking=yes
        run: bash scripts/deploy_oci_app.sh

      - name: Health check público
        run: |
          for attempt in {1..30}; do
            if curl -fsS "http://$OCI_DEPLOY_HOST:$OCI_DEPLOY_PORT/login" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          curl -fsS "http://$OCI_DEPLOY_HOST:$OCI_DEPLOY_PORT/login" >/dev/null
          exit 1
