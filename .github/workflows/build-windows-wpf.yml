name: Build Windows WPF preview
run-name: ${{ inputs.version_label || 'Build Windows WPF preview' }}

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: Identificação desta versão no histórico do workflow
        required: false
        default: Build Windows WPF preview
  push:
    branches:
      - main
    paths:
      - 'desktop_wpf/**'
      - 'app/models/api_refresh_token.py'
      - 'app/models/api_sale_request.py'
      - 'app/models/payable.py'
      - 'app/money.py'
      - 'app/routes/api/**'
      - 'app/services/notification_service.py'
      - 'migrations/tenant/**'
      - 'app/services/api_auth_service.py'
      - 'app/services/dashboard_service.py'
      - 'app/services/cash_register_service.py'
      - 'app/services/category_service.py'
      - 'app/services/product_service.py'
      - 'app/services/sale_service.py'
      - 'app/security/csrf.py'
      - 'config.py'
      - 'tests/test_routes.py'
      - '.github/workflows/build-windows-wpf.yml'
  pull_request:
    paths:
      - 'desktop_wpf/**'
      - 'app/models/api_refresh_token.py'
      - 'app/models/api_sale_request.py'
      - 'app/models/payable.py'
      - 'app/money.py'
      - 'app/routes/api/**'
      - 'app/services/notification_service.py'
      - 'migrations/tenant/**'
      - 'app/services/api_auth_service.py'
      - 'app/services/dashboard_service.py'
      - 'app/services/cash_register_service.py'
      - 'app/services/category_service.py'
      - 'app/services/product_service.py'
      - 'app/services/sale_service.py'
      - 'app/security/csrf.py'
      - 'config.py'
      - 'tests/test_routes.py'
      - '.github/workflows/build-windows-wpf.yml'

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve GiroFy version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw 'desktop_wpf/Directory.Build.props'
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida em Directory.Build.props: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Versão GiroFy: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Validate inline WPF bindings
        shell: pwsh
        run: |
          $violations = Get-ChildItem desktop_wpf/src/Girofy.Desktop -Recurse -Filter *.xaml |
            Select-String -Pattern '<Run[^>]*Text="\{Binding(?![^}]*Mode=OneWay)'
          if ($violations) {
            $violations | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Run.Text bindings must explicitly use Mode=OneWay.'
          }

          $staticThemeBrushes = Get-ChildItem desktop_wpf/src/Girofy.Desktop -Recurse -Filter *.xaml |
            Select-String -Pattern '\{StaticResource [A-Za-z]+Brush\}'
          if ($staticThemeBrushes) {
            $staticThemeBrushes | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Theme brushes must use DynamicResource so Light/Dark changes update the open window.'
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend contract tests
        env:
          TESTING: '1'
          MAIL_SUPPRESS_SEND: '1'
        run: python -m unittest discover

      - name: Restore solution
        run: dotnet restore desktop_wpf/Girofy.Desktop.sln

      - name: Run unit tests
        run: >-
          dotnet test desktop_wpf/tests/Girofy.UnitTests/Girofy.UnitTests.csproj
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"
          --blame-hang-timeout 3m

      - name: Publish self-contained Windows preview
        run: >-
          dotnet publish desktop_wpf/src/Girofy.Desktop/Girofy.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          --output desktop_wpf/artifacts/Girofy-Windows-WPF

      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $executable = Resolve-Path 'desktop_wpf/artifacts/Girofy-Windows-WPF/Girofy.exe'
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Girofy encerrou durante a inicialização com código $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build development installer
        shell: pwsh
        run: >-
          ./desktop_wpf/installer/build-installer.ps1
          -Version '${{ steps.version.outputs.version }}'

      - name: Smoke test installer lifecycle
        shell: pwsh
        run: >-
          ./desktop_wpf/installer/test-installer.ps1
          -Version '${{ steps.version.outputs.version }}'

      - name: Upload portable Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiroFy-Windows-${{ steps.version.outputs.version }}
          path: desktop_wpf/artifacts/Girofy-Windows-WPF/Girofy.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiroFy-Installer-${{ steps.version.outputs.version }}
          path: desktop_wpf/artifacts/installer/GiroFy-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish executable and installer in Windows Preview release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $executable = 'desktop_wpf/artifacts/Girofy-Windows-WPF/Girofy.exe'
          $installer = 'desktop_wpf/artifacts/installer/GiroFy-Setup-${{ steps.version.outputs.version }}.exe'
          if (-not (Test-Path $executable)) {
            throw "Executável não encontrado em $executable"
          }
          if (-not (Test-Path $installer)) {
            throw "Instalador não encontrado em $installer"
          }

          gh release view windows-preview --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-preview `
              --repo $env:GITHUB_REPOSITORY `
              --title 'Girofy Windows Preview' `
              --notes 'Canal de desenvolvimento do GiroFy Windows. Não é uma versão comercial estável.' `
              --prerelease
          }

          gh release edit windows-preview `
            --repo $env:GITHUB_REPOSITORY `
            --prerelease

          gh release upload windows-preview $executable $installer `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
