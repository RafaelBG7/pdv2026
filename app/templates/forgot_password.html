{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
  <div class="col-md-5">
    <div class="card card-dark p-4 shadow">
      <h2 class="mb-2 text-center">Redefinir senha</h2>
      <p class="text-center text-muted">Informe o e-mail cadastrado para receber o link de redefinição.</p>

      <form method="post">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="email@exemplo.com" required>
        <button class="btn btn-primary w-100 mt-3" type="submit">Enviar link</button>
      </form>

      <div class="text-center mt-3">
        <a class="text-muted" href="{{ url_for('auth.login') }}">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
