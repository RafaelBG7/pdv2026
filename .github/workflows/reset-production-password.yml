name: Reset production user password

on:
  workflow_dispatch:
    inputs:
      username:
        description: Login exato da conta que terá a senha redefinida
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: girofy-oci-deploy
  cancel-in-progress: false

jobs:
  reset-password:
    name: Redefinir senha na OCI
    runs-on:
      - self-hosted
      - linux
      - girofy-oci
    environment: production
    env:
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/girofy/app' }}
      RESET_USERNAME: ${{ inputs.username }}
      TEMP_RESET_PASSWORD: ${{ secrets.TEMP_RESET_PASSWORD }}

    steps:
      - name: Validar solicitação
        shell: bash
        run: |
          test -n "$RESET_USERNAME"
          test -n "$TEMP_RESET_PASSWORD"

      - name: Redefinir somente a conta solicitada
        shell: bash
        working-directory: ${{ env.OCI_DEPLOY_PATH }}
        run: |
          docker compose -f docker-compose.oci.yml exec -T \
            -e RESET_USERNAME \
            -e TEMP_RESET_PASSWORD \
            app python - <<'PY'
          import os

          from app import create_app
          from app.extensions import db
          from app.models import ApiRefreshToken, User

          username = os.environ['RESET_USERNAME'].strip()
          password = os.environ['TEMP_RESET_PASSWORD']
          app = create_app()

          with app.app_context():
              matches = User.query.filter_by(username=username).all()
              if len(matches) != 1:
                  raise RuntimeError(
                      f'Esperada exatamente uma conta com o login informado; encontradas: {len(matches)}.'
                  )

              user = matches[0]
              user.set_password(password)
              ApiRefreshToken.query.filter_by(user_id=user.id).delete(synchronize_session=False)
              db.session.commit()
              print(f'Senha redefinida para user_id={user.id}, username={user.username}.')
          PY
