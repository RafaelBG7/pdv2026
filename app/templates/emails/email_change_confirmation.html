<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f7f5ff;font-family:Arial,sans-serif;color:#050b2d;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;border:1px solid #ddd7f3;overflow:hidden;">
            <tr>
              <td style="padding:24px 28px;background:#030820;color:#ffffff;">
                <strong style="font-size:22px;">SkyGest</strong>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <h1 style="margin:0 0 12px;font-size:24px;">Confirmar troca de e-mail</h1>
                <p style="margin:0 0 16px;color:#68708f;">Olá, {{ user.full_name or user.username }}. Foi solicitada a troca do e-mail da sua conta para:</p>
                <p style="font-size:18px;font-weight:bold;margin:0 0 24px;">{{ new_email }}</p>
                <p style="text-align:center;margin:26px 0;">
                  <a href="{{ confirmation_url }}" style="display:inline-block;background:#6b12f1;color:#ffffff;text-decoration:none;font-weight:bold;border-radius:8px;padding:14px 22px;">Confirmar troca</a>
                </p>
                <p style="margin:0;color:#68708f;">Este link expira em 30 minutos.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px;background:#f7f5ff;color:#68708f;font-size:13px;">Se você não pediu essa troca, ignore este e-mail e altere sua senha.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
