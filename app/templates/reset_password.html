{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
  <div class="col-md-5">
    <div class="card card-dark p-4 shadow">
      <h2 class="mb-2 text-center">Nova senha</h2>
      <p class="text-center text-muted">Crie uma nova senha para acessar sua conta.</p>

      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="password">Nova senha</label>
          <input class="form-control" id="password" name="password" type="password" minlength="{{ password_min_length }}" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Confirmar senha</label>
          <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="{{ password_min_length }}" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
